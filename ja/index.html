        // an unattributed sale is a partner we cannot pay.
        var qs=new URLSearchParams(location.search);
        var ref=(qs.get("ref")||"").toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,40);
        try{ if(ref) sessionStorage.setItem("babinom_ref",ref); else ref=sessionStorage.getItem("babinom_ref")||""; }catch(e){}
        var buy=AFF[ref]||GEN;
        if(ref) buy+=(buy.indexOf("?")<0?"?":"&")+"client_reference_id="+encodeURIComponent(ref);
        document.getElementById("cta-prem").href=buy;
        document.getElementById("cta-free").href=ref?"/get/?ref="+encodeURIComponent(ref):"/get/";

        function shuffled(){var a=NAMES.slice();
          for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}
          return a.slice(0,3);}

        function cardHtml(n){
          return '<span class="stamp stamp--like">'+T.liked+'</span><span class="stamp stamp--pass">'+T.passed+'</span>'
            +'<div class="pills"><span class="pill pill--'+n.cls+'">'+n.gender+'</span>'
            +'<span class="pill pill--rank">'+n.rank+'</span></div>'
            +'<h2 class="nm">'+n.name+'</h2><p class="origin">'+n.origin+'</p><span class="divider"></span>'
            +'<p class="m-label">'+T.meaning+'</p><p class="m-text">'+n.meaning+'</p>'
            +'<div class="chips"><span class="chip">Netherlands</span><span class="chip">Europe</span></div>'
            +'<div class="card-controls">'
            +'<button class="ctl ctl--pass" aria-label="'+T.passed+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'
            +'<span class="veeg">'+T.swipe+'</span>'
            +'<button class="ctl ctl--like" aria-label="'+T.liked+'"><svg width="24" height="24" viewBox="0 0 24 24" fill="#38D39F"><path d="'+HP+'"/></svg></button>'
            +'</div>';}

        function render(){deck.innerHTML="";
          for(var i=queue.length-1;i>=0;i--){var el=document.createElement("article");
            el.className="name-card";
            el.style.transform="translateY("+(i*10)+"px) scale("+(1-i*0.04)+")";
            el.innerHTML=cardHtml(queue[i]);
            if(i===0) wire(el);
            deck.appendChild(el);}}

        function decide(like){
          if(busy||!queue.length) return; busy=true;
          var card=deck.querySelector(".name-card:last-child"),n=queue.shift();
          if(like) liked.push(n.name);
          var d=like?1:-1;
          card.style.transition="transform .42s cubic-bezier(.22,.61,.36,1),opacity .42s ease";
          card.style.transform="translate("+(d*520)+"px,"+(d*-40)+"px) rotate("+(d*22)+"deg)";
          card.style.opacity="0";
          setTimeout(function(){busy=false; if(queue.length) render(); else finish();},380);}

        function wire(el){
          var sx=0,dx=0,drag=false;
          var like=el.querySelector(".stamp--like"),pass=el.querySelector(".stamp--pass");
          // Buttons sit inside the draggable card, so their pointerdown must
          // not also start a drag - a tap would register as a 0px swipe and
          // the card would jitter under the finger.
          el.querySelector(".ctl--like").addEventListener("click",function(e){e.stopPropagation();decide(true);});
          el.querySelector(".ctl--pass").addEventListener("click",function(e){e.stopPropagation();decide(false);});
          Array.prototype.forEach.call(el.querySelectorAll(".ctl"),function(b){
            b.addEventListener("pointerdown",function(e){e.stopPropagation();});});
          el.addEventListener("pointerdown",function(e){if(busy)return;drag=true;sx=e.clientX;
            el.setPointerCapture(e.pointerId);el.style.transition="none";});
          el.addEventListener("pointermove",function(e){if(!drag)return;dx=e.clientX-sx;
            el.style.transform="translate("+dx+"px,"+(Math.abs(dx)*-0.06)+"px) rotate("+(dx/18)+"deg)";
            var t=Math.min(Math.abs(dx)/110,1);
            like.style.opacity=dx>0?t:0; pass.style.opacity=dx<0?t:0;});
          function rel(){if(!drag)return;drag=false;like.style.opacity=0;pass.style.opacity=0;
            if(Math.abs(dx)>95) decide(dx>0);
            else{el.style.transition="transform .3s cubic-bezier(.22,.61,.36,1)";el.style.transform="translateY(0) scale(1)";}
            dx=0;}
          el.addEventListener("pointerup",rel); el.addEventListener("pointercancel",rel);}

        function finish(){
          var span=document.getElementById("r-names"),ti=document.getElementById("r-title"),bo=document.getElementById("r-body");
          if(!liked.length){ti.textContent=T.nTitle;bo.textContent=T.nBody;}
          else{span.textContent=liked.length===1?liked[0]:liked.slice(0,-1).join(", ")+" + "+liked[liked.length-1];
               bo.textContent=T.rBody;}
          result.classList.add("show");}

        document.getElementById("again").addEventListener("click",function(){
          liked=[];queue=shuffled();result.classList.remove("show");render();});
        queue=shuffled(); render();
      })();
    </script>
  </body>
</html>
