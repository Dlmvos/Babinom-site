<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" />
    <title>Babinom</title>
    <!--
      /demo/ was where the swipe demo lived while it was under review. It is
      now the homepage, so this is a redirect rather than a deletion: the URL
      was shared during that review, and a 404 is a worse answer than a hop.

      canonical + noindex keep the duplicate out of search results while the
      link itself keeps working.
    -->
    <link rel="canonical" href="https://babinom.com/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=/" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <p style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:32px;text-align:center">
      The demo is now the <a href="/">Babinom home page</a>.
    </p>
    <script>
      // Preserve ?ref= so a partner link shared during review still attributes.
      location.replace('/' + location.search + location.hash);
    </script>
  </body>
</html>
