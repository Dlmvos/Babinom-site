<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Babinom — try it</title>
    <meta name="description" content="Swipe three names and see how Babinom works." />
    <meta name="robots" content="noindex" />
    <style>
      /* EVERY VALUE HERE IS SAMPLED FROM THE APP, not chosen.
         Source: store/play/screenshot/en-US/phoneScreenshots/03-Swipedeck.png,
         cross-checked against src/theme/colors.ts and the constants in
         social-content/tools/babinom_ui.py.

         The background is a warm pink-to-cream GRADIENT, not flat cream — that
         gradient is most of what makes the app feel warm, and a flat fill is
         why the first version of this page read as cold and minimal. */
      :root{
        --bg-top:#FFF1F5; --bg-bot:#FFF8F5;
        --card:#FCFCFD; --navy:#1F2937; --body:#2F3A44;
        --gray:#8C94A0; --lgry:#B0B6C2; --line:#EEF0F3; --chip:#F6F7F9;
        --pnk:#E53B7C;  --pnk-bg:#FFE4EC;
        --lav-bg:#F1EEFC; --teal:#2BC278;
        --red:#FF6B6B;  --red-bg:#FFE9E9;
        --grn:#38D39F;  --grn-bg:#E3F7EF;
      }
      *{box-sizing:border-box}
      html,body{margin:0;height:100%}
      body{
        background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-top) 38%,var(--bg-bot) 100%);
        color:var(--navy);
        font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        overflow:hidden;
      }
      .stage{position:relative;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;
             padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}

      .top{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 4px 0;
           position:relative;z-index:3}
      .wordmark{font-weight:700;letter-spacing:.14em;font-size:.82rem;text-transform:uppercase;
                color:var(--navy);text-decoration:none}
      .tag{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);
           text-align:right;max-width:9rem;line-height:1.5}
      .bottom{display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap;
              padding:0 0 26px;position:relative;z-index:3}
      .bottom a{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);
                text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px}
      .bottom a:hover{color:var(--navy);border-bottom-color:var(--pnk)}

      .hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
      .heart{position:absolute;bottom:-60px;color:var(--pnk);opacity:0;
             animation:rise var(--dur) linear var(--delay) infinite}
      .heart svg{display:block;animation:beat 1.6s ease-in-out infinite}
      @keyframes rise{
        0%{transform:translate3d(0,0,0) scale(var(--s));opacity:0}
        12%{opacity:var(--o)}88%{opacity:var(--o)}
        100%{transform:translate3d(var(--drift),calc(-100dvh - 120px),0) scale(var(--s));opacity:0}
      }
      @keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.18)}}

      .deck-wrap{position:relative;display:grid;place-items:center;z-index:2}
      /* DESKTOP SIZING. Mobile was already right; on a wide screen the old
         320px card floated in a field of nothing. The card now scales with
         viewport HEIGHT, which is what actually constrains it on a laptop. */
      .deck{position:relative;width:min(86vw,340px);height:min(62dvh,500px)}
      @media (min-width:900px) and (min-height:760px){
        /* Height is capped tighter than it looks like it should be. The app's
           card is taller because it also carries pronunciation and a longer
           meaning; without those the extra height is just a gap between the
           chips and the controls. */
        .deck{width:min(38vw,380px);height:min(60dvh,530px)}
      }

      .name-card{
        position:absolute;inset:0;background:var(--card);border-radius:34px;
        display:flex;flex-direction:column;align-items:center;text-align:center;
        padding:26px 22px 20px;
        box-shadow:0 20px 44px rgba(30,41,59,.10), 0 2px 6px rgba(30,41,59,.04);
        touch-action:pan-y;cursor:grab;will-change:transform;overflow:hidden;
      }
      .name-card:active{cursor:grabbing}

      .pills{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
      .pill{font-size:.72rem;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap}
      .pill--gender{background:rgba(229,59,124,.13);color:var(--pnk)}
      .pill--gender.boy{background:rgba(43,107,222,.13);color:#2B6BDE}
      .pill--rank{background:var(--chip);color:var(--gray)}
      .pill--common{background:var(--lav-bg);color:var(--teal)}

      .name{font-size:clamp(2.2rem,9vw,3rem);font-weight:700;line-height:1.05;margin:4px 0 6px;
            color:var(--navy);letter-spacing:-.01em}
      @media (min-width:900px) and (min-height:760px){ .name{font-size:3.3rem} }
      .country{font-style:italic;color:var(--lgry);font-size:.95rem;margin:0 0 14px}
      .divider{width:56px;height:3px;border-radius:2px;background:var(--line);margin:0 0 16px}

      .meaning-label{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
                     color:var(--gray);margin:0 0 8px}
      .meaning{font-size:.98rem;color:var(--body);line-height:1.5;margin:0 0 16px;max-width:17rem}

      .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:auto}
      .chip{background:var(--chip);color:var(--body);font-size:.78rem;font-weight:500;
            padding:7px 13px;border-radius:999px}

      /* The swipe controls live INSIDE the card, as they do in the app. */
      /* 62px PERFECT CIRCLES, from SwipeCard.tsx `actionBtn` (borderRadius 31).
         The 03-Swipedeck screenshot shows them as octagons — that is a fixed
         ANDROID RENDERING BUG, not the design. SwipeCard.tsx records it:
         "elevation 4 + shadow -> octagon fill inside a circular glow". Copying
         the screenshot would have baked a bug into the marketing site. */
      .card-controls{display:flex;align-items:center;justify-content:space-between;
                     width:100%;padding:14px 4px 0;margin-top:14px}
      .ctl{width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;
           cursor:pointer;transition:transform .12s ease}
      .ctl--pass{background:rgba(255,107,107,.15)}
      .ctl--like{background:rgba(56,211,159,.15)}
      .ctl:hover{transform:translateY(-2px)}
      .ctl:active{transform:scale(.92)}
      .veeg{font-size:.82rem;color:#9CA3AF;letter-spacing:.04em}

      .stamp{position:absolute;top:22px;font-size:.74rem;font-weight:700;letter-spacing:.16em;
             text-transform:uppercase;padding:7px 14px;border-radius:999px;opacity:0;
             border:2px solid currentColor;z-index:2}
      .stamp--like{right:18px;color:var(--grn)}
      .stamp--pass{left:18px;color:var(--red)}

      .hint{text-align:center;font-size:.78rem;color:#9CA3AF;margin:18px 0 0;position:relative;z-index:3}

      .result{position:absolute;inset:0;display:none;place-items:center;z-index:4;
              background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 100%);padding:24px}
      .result.show{display:grid}
      .result-inner{text-align:center;max-width:27rem}
      .result h1{font-size:clamp(1.5rem,6vw,2.2rem);margin:0 0 12px;line-height:1.25}
      .result p{color:var(--gray);font-size:.98rem;line-height:1.6;margin:0 0 28px}
      .btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;
           padding:15px 28px;border-radius:999px;font-weight:600;font-size:.95rem}
      .btn--ghost{background:transparent;color:var(--navy);border:1px solid var(--navy)}
      .result .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
      .again{display:block;margin:22px auto 0;background:none;border:0;color:var(--gray);
             font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit}

      @media (prefers-reduced-motion: reduce){
        .heart,.heart svg{animation:none;opacity:.12}
        .ctl{transition:none}
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="hearts" id="hearts" aria-hidden="true"></div>

      <div class="top">
        <a class="wordmark" href="/">Babinom</a>
        <div class="tag">Baby names<br />for couples</div>
      </div>

      <div class="deck-wrap">
        <div>
          <div class="deck" id="deck"></div>
          <p class="hint">Swipe or tap — nobody sees your choices</p>
        </div>
      </div>

      <div class="bottom">
        <a href="/get/">Get the app</a>
        <a href="/">How it works</a>
        <a href="/privacy/">Privacy</a>
        <a href="/support/">Support</a>
      </div>

      <div class="result" id="result">
        <div class="result-inner">
          <h1 id="result-title">You liked <span id="liked-names"></span></h1>
          <p id="result-body"></p>
          <div class="row">
            <a class="btn" id="cta-primary" href="/get/">Get Babinom — free</a>
            <a class="btn btn--ghost" id="cta-secondary" href="/get/">Unlock Premium</a>
          </div>
          <button class="again" id="again">Try three more names</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // Shaped like a real deck card: gender, popularity rank, how common the
        // name is, origin country, meaning, region chips. Names and meanings
        // come from the app's own deck — a demo showing names the app does not
        // have is a promise the product breaks on first launch.
        var NAMES = [
          { name:"Aurelia", gender:"Girl", rank:"#412", common:"Less common",
            country:"Italy",       meaning:"“The golden one”", chips:["Italy","Europe"] },
          { name:"Liam",    gender:"Boy",  rank:"#1",   common:"Very popular",
            country:"Ireland",     meaning:"“Strong-willed warrior”", chips:["Ireland","Europe"] },
          { name:"Sofia",   gender:"Girl", rank:"#9",   common:"Popular",
            country:"Spain",       meaning:"“Wisdom”", chips:["Spain","Europe"] },
          { name:"Mateo",   gender:"Boy",  rank:"#24",  common:"Popular",
            country:"Spain",       meaning:"“Gift of God”", chips:["Spain","Europe"] },
          { name:"Nora",    gender:"Girl", rank:"#63",  common:"Well known",
            country:"Netherlands", meaning:"“Light, honour”", chips:["Netherlands","Europe"] },
          { name:"Julian",  gender:"Boy",  rank:"#71",  common:"Well known",
            country:"Netherlands", meaning:"“Youthful, downy”", chips:["Netherlands","Europe"] }
        ];

        var ROUND = 3;
        var deck = document.getElementById("deck");
        var result = document.getElementById("result");
        var liked = [], queue = [], busy = false;

        var HEART_PATH = "M12 21s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 8.2 4.5 4.5 0 0 1 19.5 11c0 5.4-7.5 10-7.5 10z";

        // Ambient hearts, built in JS so each gets its own drift, duration and
        // delay. In CSS alone all fourteen move identically, which reads as a
        // looping GIF rather than as atmosphere.
        (function hearts() {
          var svg = '<svg width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor">'
                  + '<path d="' + HEART_PATH + '"/></svg>';
          var html = "";
          for (var i = 0; i < 14; i++) {
            var size = 10 + Math.random() * 26;
            html += '<span class="heart" style="'
                 + "left:" + (Math.random()*100).toFixed(2) + "%;"
                 + "width:" + size.toFixed(0) + "px;height:" + size.toFixed(0) + "px;"
                 + "--dur:" + (14 + Math.random()*16).toFixed(1) + "s;"
                 + "--delay:-" + (Math.random()*24).toFixed(1) + "s;"
                 + "--drift:" + (Math.random()*120 - 60).toFixed(0) + "px;"
                 + "--s:" + (0.7 + Math.random()*0.6).toFixed(2) + ";"
                 + "--o:" + (0.10 + Math.random()*0.16).toFixed(2) + ";"
                 + '">' + svg + "</span>";
          }
          document.getElementById("hearts").innerHTML = html;
        })();

        // Where the end-of-demo CTA sends people. A visitor who arrived from a
        // partner page keeps that attribution, so the partner is paid for a
        // sale that finishes here. sessionStorage as well as the query string,
        // because the hop can lose a param to a share sheet or in-app browser.
        var AFFILIATE_BUY = { verloscast:"https://buy.stripe.com/test_8x2eVc0ZY4QD7iQ4lfeUU00" };
        var GENERIC_BUY = "https://buy.stripe.com/test_00w5kC4ca2Iv8mU8BveUU01";

        var qs = new URLSearchParams(location.search);
        var ref = (qs.get("ref") || "").toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,40);
        try {
          if (ref) sessionStorage.setItem("babinom_ref", ref);
          else ref = sessionStorage.getItem("babinom_ref") || "";
        } catch (e) { /* private mode: the query string alone still works */ }

        var buyUrl = AFFILIATE_BUY[ref] || GENERIC_BUY;
        if (ref) buyUrl += (buyUrl.indexOf("?") < 0 ? "?" : "&")
                        + "client_reference_id=" + encodeURIComponent(ref);
        document.getElementById("cta-secondary").href = buyUrl;
        document.getElementById("cta-primary").href = ref ? "/get/?ref=" + encodeURIComponent(ref) : "/get/";

        function shuffled() {
          var a = NAMES.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t;
          }
          return a.slice(0, ROUND);
        }

        function cardHtml(n) {
          var chips = n.chips.map(function (c) {
            return '<span class="chip">' + c + "</span>";
          }).join("");
          return '<span class="stamp stamp--like">Liked</span>'
               + '<span class="stamp stamp--pass">Pass</span>'
               + '<div class="pills">'
               +   '<span class="pill pill--gender' + (n.gender === 'Boy' ? ' boy' : '') + '">' + n.gender + "</span>"
               +   '<span class="pill pill--rank">' + n.rank + "</span>"
               +   '<span class="pill pill--common">' + n.common + "</span>"
               + "</div>"
               + '<h2 class="name">' + n.name + "</h2>"
               + '<p class="country">' + n.country + "</p>"
               + '<span class="divider"></span>'
               + '<p class="meaning-label">Meaning</p>'
               + '<p class="meaning">' + n.meaning + "</p>"
               + '<div class="chips">' + chips + "</div>"
               + '<div class="card-controls">'
               +   '<button class="ctl ctl--pass" aria-label="Pass on this name">'
               +     '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
               +   "</button>"
               +   '<span class="veeg">&larr; swipe &rarr;</span>'
               +   '<button class="ctl ctl--like" aria-label="Like this name">'
               +     '<svg width="24" height="24" viewBox="0 0 24 24" fill="#38D39F" aria-hidden="true"><path d="' + HEART_PATH + '"/></svg>'
               +   "</button>"
               + "</div>";
        }

        function render() {
          deck.innerHTML = "";
          // Back to front, so the next card to be swiped is LAST in the DOM and
          // therefore on top without z-index bookkeeping.
          for (var i = queue.length - 1; i >= 0; i--) {
            var el = document.createElement("article");
            el.className = "name-card";
            el.style.transform = "translateY(" + (i*10) + "px) scale(" + (1 - i*0.04) + ")";
            el.innerHTML = cardHtml(queue[i]);
            if (i === 0) wire(el);
            deck.appendChild(el);
          }
        }

        function topCard() { return deck.querySelector(".name-card:last-child"); }

        function decide(isLike) {
          if (busy || !queue.length) return;
          busy = true;
          var card = topCard();
          var n = queue.shift();
          if (isLike) liked.push(n.name);
          var dir = isLike ? 1 : -1;
          card.style.transition = "transform .42s cubic-bezier(.22,.61,.36,1), opacity .42s ease";
          card.style.transform = "translate(" + (dir*520) + "px," + (dir*-40) + "px) rotate(" + (dir*22) + "deg)";
          card.style.opacity = "0";
          setTimeout(function () {
            busy = false;
            if (queue.length) render(); else finish();
          }, 380);
        }

        function wire(el) {
          var startX = 0, dx = 0, dragging = false;
          var like = el.querySelector(".stamp--like");
          var pass = el.querySelector(".stamp--pass");

          // The buttons sit inside the draggable card, so their pointerdown
          // must not also start a drag — otherwise a tap registers as a 0px
          // swipe and the card jitters under the finger.
          el.querySelector(".ctl--like").addEventListener("click", function (e) { e.stopPropagation(); decide(true); });
          el.querySelector(".ctl--pass").addEventListener("click", function (e) { e.stopPropagation(); decide(false); });
          el.querySelectorAll(".ctl").forEach(function (b) {
            b.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
          });

          el.addEventListener("pointerdown", function (e) {
            if (busy) return;
            dragging = true; startX = e.clientX;
            el.setPointerCapture(e.pointerId);
            el.style.transition = "none";
          });
          el.addEventListener("pointermove", function (e) {
            if (!dragging) return;
            dx = e.clientX - startX;
            el.style.transform = "translate(" + dx + "px," + (Math.abs(dx)*-0.06) + "px) rotate(" + (dx/18) + "deg)";
            var t = Math.min(Math.abs(dx)/110, 1);
            like.style.opacity = dx > 0 ? t : 0;
            pass.style.opacity = dx < 0 ? t : 0;
          });
          function release() {
            if (!dragging) return;
            dragging = false;
            like.style.opacity = 0; pass.style.opacity = 0;
            if (Math.abs(dx) > 95) decide(dx > 0);
            else {
              el.style.transition = "transform .3s cubic-bezier(.22,.61,.36,1)";
              el.style.transform = "translateY(0) scale(1)";
            }
            dx = 0;
          }
          el.addEventListener("pointerup", release);
          el.addEventListener("pointercancel", release);
        }

        function finish() {
          var span = document.getElementById("liked-names");
          var title = document.getElementById("result-title");
          var body = document.getElementById("result-body");
          if (liked.length === 0) {
            title.textContent = "Not one of them?";
            body.textContent = "That happens — there are hundreds of thousands more in the app, "
                             + "filtered by origin, style and country.";
          } else {
            span.textContent = liked.length === 1 ? liked[0]
              : liked.slice(0,-1).join(", ") + " and " + liked[liked.length-1];
            body.textContent = "That is the whole idea. You swipe privately, your partner swipes "
                             + "privately, and a name only surfaces when you both said yes.";
          }
          result.classList.add("show");
        }

        document.getElementById("again").addEventListener("click", function () {
          liked = []; queue = shuffled(); result.classList.remove("show"); render();
        });

        queue = shuffled();
        render();
      })();
    </script>
  </body>
</html>
