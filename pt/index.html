<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Babinom — baby names for couples</title>
    <meta name="description" content="Swipe baby names privately. A name becomes a match only when you both like it." />
    <link rel="canonical" href="https://babinom.com/pt/" />
    <link rel="alternate" hreflang="en" href="https://babinom.com/" />
    <link rel="alternate" hreflang="nl" href="https://babinom.com/nl/" />
    <link rel="alternate" hreflang="de" href="https://babinom.com/de/" />
    <link rel="alternate" hreflang="fr" href="https://babinom.com/fr/" />
    <link rel="alternate" hreflang="es" href="https://babinom.com/es/" />
    <link rel="alternate" hreflang="it" href="https://babinom.com/it/" />
    <link rel="alternate" hreflang="pt" href="https://babinom.com/pt/" />
    <link rel="alternate" hreflang="zh" href="https://babinom.com/zh/" />
    <link rel="alternate" hreflang="ja" href="https://babinom.com/ja/" />
    <link rel="alternate" hreflang="ko" href="https://babinom.com/ko/" />
    <link rel="alternate" hreflang="ar" href="https://babinom.com/ar/" />
    <link rel="alternate" hreflang="x-default" href="https://babinom.com/" />
    <style>
      :root{--bg-top:#FFF1F5;--bg-bot:#FFF8F5;--card:#FCFCFD;--navy:#1F2937;
            --body:#2F3A44;--gray:#8C94A0;--lgry:#B0B6C2;--line:#EEF0F3;
            --chip:#F6F7F9;--pnk:#E53B7C;--grn:#38D39F;--red:#FF6B6B}
      *{box-sizing:border-box}
      html,body{margin:0}
      body{background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-top) 38%,var(--bg-bot) 100%);
           color:var(--navy);font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
      .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
      a{color:inherit}
      .lang select{font:inherit;font-size:.76rem;color:var(--gray);background:transparent;border:0;cursor:pointer}

      body{overflow:hidden}
      .stage{position:relative;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;
             padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
      .top{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 4px 0;position:relative;z-index:3}
      .wordmark{font-weight:700;letter-spacing:.14em;font-size:.82rem;text-transform:uppercase;text-decoration:none}
      .tag{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);text-align:end;max-width:9rem;line-height:1.5}
      .bottom{display:flex;gap:20px;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 0 24px;position:relative;z-index:3}
      .bottom a{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px}
      .bottom a:hover{color:var(--navy);border-bottom-color:var(--pnk)}
      .hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
      .heart{position:absolute;bottom:-60px;color:var(--pnk);opacity:0;animation:rise var(--dur) linear var(--delay) infinite}
      .heart svg{display:block;animation:beat 1.6s ease-in-out infinite}
      @keyframes rise{0%{transform:translate3d(0,0,0) scale(var(--s));opacity:0}12%{opacity:var(--o)}88%{opacity:var(--o)}
        100%{transform:translate3d(var(--drift),calc(-100dvh - 120px),0) scale(var(--s));opacity:0}}
      @keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.18)}}
      .deck-wrap{position:relative;display:grid;place-items:center;z-index:2}
      .deck{position:relative;width:min(86vw,340px);height:min(62dvh,500px)}
      @media(min-width:900px) and (min-height:760px){.deck{width:min(38vw,380px);height:min(60dvh,530px)}}
      .name-card{position:absolute;inset:0;background:var(--card);border-radius:34px;display:flex;
        flex-direction:column;align-items:center;text-align:center;padding:26px 22px 20px;
        box-shadow:0 20px 44px rgba(30,41,59,.10),0 2px 6px rgba(30,41,59,.04);
        touch-action:pan-y;cursor:grab;will-change:transform;overflow:hidden}
      .pills{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
      .pill{font-size:.72rem;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap}
      .pill--girl{background:rgba(229,59,124,.13);color:var(--pnk)}
      .pill--boy{background:rgba(43,107,222,.13);color:#2B6BDE}
      .pill--rank{background:var(--chip);color:var(--gray)}
      .nm{font-size:clamp(2.2rem,9vw,3rem);font-weight:700;line-height:1.05;margin:4px 0 6px;letter-spacing:-.01em}
      @media(min-width:900px) and (min-height:760px){.nm{font-size:3.3rem}}
      .origin{font-style:italic;color:var(--lgry);font-size:.95rem;margin:0 0 14px}
      .divider{width:56px;height:3px;border-radius:2px;background:var(--line);margin:0 0 16px}
      .m-label{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gray);margin:0 0 8px}
      .m-text{font-size:.98rem;color:var(--body);line-height:1.5;margin:0 0 16px;max-width:17rem}
      .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:auto}
      .chip{background:var(--chip);color:var(--body);font-size:.78rem;font-weight:500;padding:7px 13px;border-radius:999px}
      .card-controls{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px 0;margin-top:14px}
      .ctl{width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;transition:transform .12s ease}
      .ctl--pass{background:rgba(255,107,107,.15)}
      .ctl--like{background:rgba(56,211,159,.15)}
      .ctl:hover{transform:translateY(-2px)}
      .ctl:active{transform:scale(.92)}
      .veeg{font-size:.82rem;color:#9CA3AF}
      .stamp{position:absolute;top:22px;font-size:.74rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
             padding:7px 14px;border-radius:999px;opacity:0;border:2px solid currentColor;z-index:2}
      .stamp--like{inset-inline-end:18px;color:var(--grn)}
      .stamp--pass{inset-inline-start:18px;color:var(--red)}
      .hint{text-align:center;font-size:.78rem;color:#9CA3AF;margin:18px 0 0;position:relative;z-index:3}
      .result{position:absolute;inset:0;display:none;place-items:center;z-index:4;
              background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 100%);padding:24px}
      .result.show{display:grid}
      .r-in{text-align:center;max-width:27rem}
      .r-in h1{font-size:clamp(1.5rem,6vw,2.2rem);margin:0 0 12px;line-height:1.25}
      .r-in p{color:var(--gray);font-size:.98rem;line-height:1.6;margin:0 0 28px}
      .btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:15px 28px;
           border-radius:999px;font-weight:600;font-size:.95rem}
      .btn--ghost{background:transparent;color:var(--navy);border:1px solid var(--navy)}
      .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
      .again{display:block;margin:22px auto 0;background:none;border:0;color:var(--gray);font-size:.8rem;
             cursor:pointer;text-decoration:underline;font-family:inherit}
      @media (prefers-reduced-motion: reduce){.heart,.heart svg{animation:none;opacity:.12}.ctl{transition:none}}
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="hearts" id="hearts" aria-hidden="true"></div>
      <div class="top">
        <a class="wordmark" href="/pt/">Babinom</a>
        <div class="tag">Baby names<br />for couples</div>
      </div>
      <div class="deck-wrap"><div>
        <div class="deck" id="deck"></div>
        <p class="hint">Swipe or tap — nobody sees your choices</p>
      </div></div>
      <div class="bottom">
        <a href="/get/">Get the app</a>
        <a href="/pt/how-it-works/">How it works</a>
        <a href="/privacy/">Privacy</a>
        <a href="/support/">Support</a>
        <label class="lang"><span class="sr-only">Language</span><select id="lang-select" aria-label="Language"><option value="/" data-lang="en">English</option><option value="/nl/" data-lang="nl">Nederlands</option><option value="/de/" data-lang="de">Deutsch</option><option value="/fr/" data-lang="fr">Français</option><option value="/es/" data-lang="es">Español</option><option value="/it/" data-lang="it">Italiano</option><option value="/pt/" data-lang="pt" selected>Português</option><option value="/zh/" data-lang="zh">中文</option><option value="/ja/" data-lang="ja">日本語</option><option value="/ko/" data-lang="ko">한국어</option><option value="/ar/" data-lang="ar">العربية</option></select></label>
      </div>
      <div class="result" id="result"><div class="r-in">
        <h1 id="r-title">You liked <span id="r-names"></span></h1>
        <p id="r-body"></p>
        <div class="row">
          <a class="btn" id="cta-free" href="/get/">Get Babinom — free</a>
          <a class="btn btn--ghost" id="cta-prem" href="/get/">Unlock Premium</a>
        </div>
        <button class="again" id="again">Try three more names</button>
      </div></div>
    </div>
    <script>
      var T={"meaning":"Meaning","liked":"Liked","passed":"Pass","swipe":"&larr; swipe &rarr;","rTitle":"You liked","rBody":"That is the whole idea. You swipe privately, your partner swipes privately, and a name only surfaces when you both said yes.","nTitle":"Not one of them?","nBody":"That happens — there are hundreds of thousands more in the app, filtered by origin, style and country."};
      var NAMES=[{"name":"Nora","gender":"Girl","cls":"girl","rank":"#3 · Top 50","origin":"Irish / Arabic","meaning":"Honor; light"},{"name":"Liam","gender":"Boy","cls":"boy","rank":"#4 · Top 50","origin":"Irish / American","meaning":"Strong-willed warrior; protector"},{"name":"Sofia","gender":"Girl","cls":"girl","rank":"#24 · Top 50","origin":"Greek","meaning":"Wisdom"},{"name":"Julian","gender":"Boy","cls":"boy","rank":"#45 · Top 50","origin":"Latin","meaning":"Youthful; downy"},{"name":"Mateo","gender":"Boy","cls":"boy","rank":"#102","origin":"Spanish","meaning":"Gift of God"}];
      var AFF={"verloscast":"https://buy.stripe.com/test_8x2eVc0ZY4QD7iQ4lfeUU00"},GEN="https://buy.stripe.com/test_00w5kC4ca2Iv8mU8BveUU01";

      // LANGUAGE — two rules, and the second matters more than the first.
      //
      // 1. Detect ONCE, on the English root only. navigator.language is the
      //    visitor's own setting, which beats IP: a Dutch speaker in Spain
      //    should get Dutch, not Spanish.
      // 2. A MANUAL CHOICE WINS AND STICKS. Stored on pick, checked before any
      //    redirect, and detection never runs twice. Auto-detection is wrong
      //    for somebody however it is built, and someone who cannot escape the
      //    wrong language leaves.
      (function(){
        var DIRS={"en":"/","nl":"/nl/","de":"/de/","fr":"/fr/","es":"/es/","it":"/it/","pt":"/pt/","zh":"/zh/","ja":"/ja/","ko":"/ko/","ar":"/ar/"}, KEY="babinom_lang";
        var sel=document.getElementById("lang-select");
        function store(v){try{localStorage.setItem(KEY,v)}catch(e){}}
        function stored(){try{return localStorage.getItem(KEY)}catch(e){return null}}
        if(sel){sel.addEventListener("change",function(){
          var o=sel.options[sel.selectedIndex];
          store(o.getAttribute("data-lang"));   // remember the LANGUAGE, not the URL
          location.href=o.value;
        });}
        if("pt"!=="en") return;
        if(location.search.indexOf("nolang")>=0) return;
        if(stored()) return;
        try{ if(sessionStorage.getItem("babinom_lang_seen")) return;
             sessionStorage.setItem("babinom_lang_seen","1"); }catch(e){}
        var want=(navigator.language||"en").toLowerCase().split("-")[0];
        if(DIRS[want]&&want!=="en") location.replace(DIRS[want]+location.search+location.hash);
      })();

      (function(){
        "use strict";
        var HP="M12 21s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 8.2 4.5 4.5 0 0 1 19.5 11c0 5.4-7.5 10-7.5 10z";
        var deck=document.getElementById("deck"),result=document.getElementById("result");
        var liked=[],queue=[],busy=false;

        (function hearts(){
          var svg='<svg width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor"><path d="'+HP+'"/></svg>',h="";
          for(var i=0;i<14;i++){var s=10+Math.random()*26;
            h+='<span class="heart" style="left:'+(Math.random()*100).toFixed(2)+'%;width:'+s.toFixed(0)+'px;height:'+s.toFixed(0)+'px;--dur:'
              +(14+Math.random()*16).toFixed(1)+'s;--delay:-'+(Math.random()*24).toFixed(1)+'s;--drift:'
              +(Math.random()*120-60).toFixed(0)+'px;--s:'+(0.7+Math.random()*0.6).toFixed(2)+';--o:'
              +(0.10+Math.random()*0.16).toFixed(2)+'">'+svg+'</span>';}
          document.getElementById("hearts").innerHTML=h;
        })();

        // Attribution survives the hop: sessionStorage as well as the query
        // string, because a share sheet or in-app browser can drop a param and
        // an unattributed sale is a partner we cannot pay.
        var qs=new URLSearchParams(location.search);
        var ref=(qs.get("ref")||"").toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,40);
        try{ if(ref) sessionStorage.setItem("babinom_ref",ref); else ref=sessionStorage.getItem("babinom_ref")||""; }catch(e){}
        var buy=AFF[ref]||GEN;
        if(ref) buy+=(buy.indexOf("?")<0?"?":"&")+"client_reference_id="+encodeURIComponent(ref);
        document.getElementById("cta-prem").href=buy;
        document.getElementById("cta-free").href=ref?"/get/?ref="+encodeURIComponent(ref):"/get/";

        function shuffled(){var a=NAMES.slice();
          for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}
          return a.slice(0,3);}

        function cardHtml(n){
          return '<span class="stamp stamp--like">'+T.liked+'</span><span class="stamp stamp--pass">'+T.passed+'</span>'
            +'<div class="pills"><span class="pill pill--'+n.cls+'">'+n.gender+'</span>'
            +'<span class="pill pill--rank">'+n.rank+'</span></div>'
            +'<h2 class="nm">'+n.name+'</h2><p class="origin">'+n.origin+'</p><span class="divider"></span>'
            +'<p class="m-label">'+T.meaning+'</p><p class="m-text">'+n.meaning+'</p>'
            +'<div class="chips"><span class="chip">Netherlands</span><span class="chip">Europe</span></div>'
            +'<div class="card-controls">'
            +'<button class="ctl ctl--pass" aria-label="'+T.passed+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'
            +'<span class="veeg">'+T.swipe+'</span>'
            +'<button class="ctl ctl--like" aria-label="'+T.liked+'"><svg width="24" height="24" viewBox="0 0 24 24" fill="#38D39F"><path d="'+HP+'"/></svg></button>'
            +'</div>';}

        function render(){deck.innerHTML="";
          for(var i=queue.length-1;i>=0;i--){var el=document.createElement("article");
            el.className="name-card";
            el.style.transform="translateY("+(i*10)+"px) scale("+(1-i*0.04)+")";
            el.innerHTML=cardHtml(queue[i]);
            if(i===0) wire(el);
            deck.appendChild(el);}}

        function decide(like){
          if(busy||!queue.length) return; busy=true;
          var card=deck.querySelector(".name-card:last-child"),n=queue.shift();
          if(like) liked.push(n.name);
          var d=like?1:-1;
          card.style.transition="transform .42s cubic-bezier(.22,.61,.36,1),opacity .42s ease";
          card.style.transform="translate("+(d*520)+"px,"+(d*-40)+"px) rotate("+(d*22)+"deg)";
          card.style.opacity="0";
          setTimeout(function(){busy=false; if(queue.length) render(); else finish();},380);}

        function wire(el){
          var sx=0,dx=0,drag=false;
          var like=el.querySelector(".stamp--like"),pass=el.querySelector(".stamp--pass");
          // Buttons sit inside the draggable card, so their pointerdown must
          // not also start a drag - a tap would register as a 0px swipe and
          // the card would jitter under the finger.
          el.querySelector(".ctl--like").addEventListener("click",function(e){e.stopPropagation();decide(true);});
          el.querySelector(".ctl--pass").addEventListener("click",function(e){e.stopPropagation();decide(false);});
          Array.prototype.forEach.call(el.querySelectorAll(".ctl"),function(b){
            b.addEventListener("pointerdown",function(e){e.stopPropagation();});});
          el.addEventListener("pointerdown",function(e){if(busy)return;drag=true;sx=e.clientX;
            el.setPointerCapture(e.pointerId);el.style.transition="none";});
          el.addEventListener("pointermove",function(e){if(!drag)return;dx=e.clientX-sx;
            el.style.transform="translate("+dx+"px,"+(Math.abs(dx)*-0.06)+"px) rotate("+(dx/18)+"deg)";
            var t=Math.min(Math.abs(dx)/110,1);
            like.style.opacity=dx>0?t:0; pass.style.opacity=dx<0?t:0;});
          function rel(){if(!drag)return;drag=false;like.style.opacity=0;pass.style.opacity=0;
            if(Math.abs(dx)>95) decide(dx>0);
            else{el.style.transition="transform .3s cubic-bezier(.22,.61,.36,1)";el.style.transform="translateY(0) scale(1)";}
            dx=0;}
          el.addEventListener("pointerup",rel); el.addEventListener("pointercancel",rel);}

        function finish(){
          var span=document.getElementById("r-names"),ti=document.getElementById("r-title"),bo=document.getElementById("r-body");
          if(!liked.length){ti.textContent=T.nTitle;bo.textContent=T.nBody;}
          else{span.textContent=liked.length===1?liked[0]:liked.slice(0,-1).join(", ")+" + "+liked[liked.length-1];
               bo.textContent=T.rBody;}
          result.classList.add("show");}

        document.getElementById("again").addEventListener("click",function(){
          liked=[];queue=shuffled();result.classList.remove("show");render();});
        queue=shuffled(); render();
      })();
    </script>
  </body>
</html>
